name: Deploy chamboko basicx site

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required deployment secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          test -n "$FTP_SERVER" || (echo "Missing GitHub secret FTP_SERVER" && exit 1)
          test -n "$FTP_USERNAME" || (echo "Missing GitHub secret FTP_USERNAME" && exit 1)
          test -n "$FTP_PASSWORD" || (echo "Missing GitHub secret FTP_PASSWORD" && exit 1)

      - name: Deploy Django project files to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./
          server-dir: /public_html/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/venv/**
            **/.venv/**
            **/__pycache__/**
            **/*.py[cod]
            **/.env
            **/db.sqlite3
            **/media/**
            **/staticfiles/**
            **/logs/**
